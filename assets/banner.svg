<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="VideoLens: give your AI eyes on video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="300" cy="320" r="260" fill="url(#glow)"/>

  <!-- lens -->
  <circle cx="300" cy="320" r="150" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <circle cx="300" cy="320" r="112" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M272 262 L272 378 L368 320 Z" fill="#ffffff"/>
  <path d="M390 442 L470 522" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  <path d="M205 255 A110 110 0 0 1 258 208" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>

  <!-- text -->
  <text x="560" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-2">VideoLens</text>
  <text x="564" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" fill="#c9d1ff">Give your AI eyes on video.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">
    <rect x="564" y="410" width="132" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="630" y="441" text-anchor="middle">comments</text>
    <rect x="708" y="410" width="156" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="786" y="441" text-anchor="middle">transcripts</text>
    <rect x="876" y="410" width="110" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="931" y="441" text-anchor="middle">frames</text>
    <rect x="998" y="410" width="82" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="1039" y="441" text-anchor="middle">OCR</text>
    <rect x="564" y="470" width="130" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="629" y="501" text-anchor="middle">Whisper</text>
    <rect x="706" y="470" width="150" height="46" rx="23" fill="#ffffff" fill-opacity="0.10"/>
    <text x="781" y="501" text-anchor="middle">research</text>
    <rect x="868" y="470" width="170" height="46" rx="23" fill="#ff4d4d" fill-opacity="0.85"/>
    <text x="953" y="501" text-anchor="middle">no API key</text>
  </g>
</svg>
